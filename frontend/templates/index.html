<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Intelligence Platform</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            padding-top: 60px;
        }
        .card {
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card-title {
            font-size: 1.4rem;
            font-weight: 600;
        }
        .card-text {
            font-size: 1rem;
        }
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="mb-5">Welcome to Product Intelligence Platform</h1>

        <div class="cards-container">
            <!-- Structured ML Module -->
            <div class="card shadow-sm" style="width: 18rem;" onclick="window.location.href='/structured'">
                <div class="card-body">
                    <h5 class="card-title">Structured ML</h5>
                    <p class="card-text">Train, evaluate, and predict on structured datasets using ML pipelines.</p>
                </div>
            </div>

            <!-- GAN Module -->
            <div class="card shadow-sm" style="width: 18rem;" onclick="window.location.href='/generate'">
                <div class="card-body">
                    <h5 class="card-title">GAN Image Generator</h5>
                    <p class="card-text">Generate synthetic images using our trained GAN models.</p>
                </div>
            </div>

            <!-- NLP Module -->
            <div class="card shadow-sm" style="width: 18rem;" onclick="window.location.href='/nlp'">
                <div class="card-body">
                    <h5 class="card-title">NLP Text Analysis</h5>
                    <p class="card-text">Analyze text data, run sentiment analysis, and fine-tune NLP models.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
