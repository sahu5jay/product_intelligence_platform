<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 40px;
        }

        .container-box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        }

        .result-box {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: green;
            text-align: center;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2 class="text-center mb-4">House Price Prediction</h2>

        <div class="container-box">

            <form action="/predict" method="POST">

                <div class="mb-3">
                    <label class="form-label">GrLivArea (Living Area)</label>
                    <input type="number" class="form-control" name="GrLivArea" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Overall Quality</label>
                    <input type="number" class="form-control" name="OverallQual" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Year Built</label>
                    <input type="number" class="form-control" name="YearBuilt" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Total Basement Area</label>
                    <input type="number" class="form-control" name="TotalBsmtSF" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Garage Cars</label>
                    <input type="number" class="form-control" name="GarageCars" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Neighborhood</label>
                    <select class="form-control" name="Neighborhood">

                        <option value="NAmes">NAmes</option>
                        <option value="CollgCr">CollgCr</option>
                        <option value="OldTown">OldTown</option>
                        <option value="Edwards">Edwards</option>
                        <option value="Somerst">Somerst</option>

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Exterior Quality</label>
                    <select class="form-control" name="ExterQual">

                        <option value="TA">TA</option>
                        <option value="Gd">Gd</option>
                        <option value="Ex">Ex</option>
                        <option value="Fa">Fa</option>

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Kitchen Quality</label>
                    <select class="form-control" name="KitchenQual">

                        <option value="TA">TA</option>
                        <option value="Gd">Gd</option>
                        <option value="Ex">Ex</option>
                        <option value="Fa">Fa</option>

                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Predict Price
                </button>

            </form>

            {% if final_result %}

            <div class="result-box">

                Predicted House Price : {{ final_result }}

            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
