<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NLP Text Analysis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 60px;
        }

        .container-box {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
        }

        .result-box {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        .spinner-border {
            display: none;
            margin: auto;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2 class="text-center mb-4">NLP Text Sentiment Analysis</h2>

        <div class="container-box">

            <form action="/analyze-text" id="nlp-form">

                <div class="mb-3">

                    <label class="form-label">Enter Text</label>

                    <textarea class="form-control" id="text-input" rows="4"
                        placeholder="Enter text for sentiment analysis..." required></textarea>

                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Analyze Text
                </button>

                <div class="text-center mt-3">
                    <div id="loading" class="spinner-border text-primary"></div>
                </div>

            </form>

            <div id="result" class="result-box"></div>

        </div>

    </div>


    <script>

        const form = document.getElementById("nlp-form")
        const resultDiv = document.getElementById("result")
        const loading = document.getElementById("loading")

        form.addEventListener("submit", async function (e) {

            e.preventDefault()

            loading.style.display = "inline-block"
            resultDiv.innerHTML = ""

            const text = document.getElementById("text-input").value

            try {

                const response = await fetch("/analyze-text", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({ text: text })

                })

                const data = await response.json()

                if (data.success) {

                    resultDiv.innerHTML =
                        `Sentiment Prediction : <span class="text-success">${data.result}</span>`

                }
                else {

                    resultDiv.innerHTML =
                        `<span class="text-danger">Error : ${data.error}</span>`

                }

            }
            catch (err) {

                resultDiv.innerHTML =
                    "<span class='text-danger'>Server Error</span>"

            }

            loading.style.display = "none"

        })

    </script>

</body>

</html>
