<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Fashion Images</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .images-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .image-card {
            background-color: #fff;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 200px;
        }

        .image-card img {
            max-width: 100%;
            border-radius: 8px;
        }

        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <h2>Generated Fashion Images</h2>
    <div class="images-container">
        {% for img_path in images %}
        <div class="image-card">
            <img src="{{ url_for('static', filename='generated_images/' ~ img_path) }}" alt="Generated Image">
            <a href="{{ url_for('static', filename='generated_images/' ~ img_path) }}" download
                class="download-btn">Download</a>
        </div>
        {% endfor %}
    </div>
</body>

</html>
