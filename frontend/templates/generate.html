<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAN Image Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 50px; background-color: #f8f9fa; }
        .generated-image { max-width: 256px; max-height: 256px; margin: 10px; border: 1px solid #dee2e6; border-radius: 8px; }
        .spinner-border { display: none; }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="mb-4">GAN Image Generator</h1>
        <button id="generate-btn" class="btn btn-primary btn-lg mb-4">Generate Image</button>
        <div id="loading" class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Generating...</span>
        </div>
        <div id="image-container" class="d-flex flex-wrap justify-content-center"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const generateBtn = document.getElementById("generate-btn");
        const imageContainer = document.getElementById("image-container");
        const loading = document.getElementById("loading");

        generateBtn.addEventListener("click", async () => {
            loading.style.display = "inline-block";
            try {
                const response = await fetch("/generate-image", { method: "POST" });
                const data = await response.json();

                if (data.success) {
                    const img = document.createElement("img");
                    img.src = data.image_url;
                    img.classList.add("generated-image");
                    imageContainer.prepend(img);
                } else {
                    alert("Error generating image: " + data.error);
                }
            } catch (err) {
                console.error(err);
                alert("Unexpected error occurred.");
            } finally {
                loading.style.display = "none";
            }
        });
    </script>
</body>
</html>
